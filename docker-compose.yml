services:
  redmine-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: redmine-mcp:latest
    container_name: redmine-mcp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - REDMINE_URL=${REDMINE_URL:-https://redmine.example.com}
      - REDMINE_API_KEY=${REDMINE_API_KEY:-your_redmine_api_key}
      - TRANSPORT=http
      - PORT=3000
      - LOG_LEVEL=info
